name: Enhancement
description: Add a new flow, feature, or logic that is not yet in the living documentation.
type: Enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use **Enhancement** to add a new flow, feature, or logic.
        To change something that already exists, use **Changes**.
        Fill in the **Related issues** field with the existing issues this enhancement builds on or depends on.

  - type: textarea
    id: need
    attributes:
      label: Need
      description: Who needs it, what they need, and why.
      placeholder: "As a merchant, I want ... so that ..."
    validations:
      required: true

  - type: textarea
    id: flow
    attributes:
      label: Proposed flow
      description: The new steps or rules being proposed.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact and dependencies
      description: Other features, data, or requirements that are related or affected.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions that mark this enhancement as done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What is deliberately not included in this enhancement.
    validations:
      required: false
