name: Changes
description: Change an existing flow, feature, or logic described in the living documentation.
type: Changes
body:
  - type: markdown
    attributes:
      value: |
        Use **Changes** to change a flow, feature, or logic that already exists.
        For a new flow, feature, or logic, use **Enhancement**. For user behavior that the documentation does not cover and that conflicts with other requirements, use **Problem**.
        Fill in the **Related issues** field with the issues whose requirements this change affects.

  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What applies today according to the living documentation.
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: Requested change
      description: What should apply after this change.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why this change is needed.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact on other parts
      description: Other features, data, or requirements affected by this change. Can be completed during analysis.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions that mark this change as done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
