name: Task
description: Technical work that does not change requirements, such as setup, infrastructure, or upgrades.
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Use **Task** only for technical work that does not change requirements, such as setup, infrastructure, refactoring, or upgrades.
        Requirements, including finalized MVP requirements from the PRD, use **Enhancement**.

  - type: textarea
    id: work
    attributes:
      label: Work
      description: What needs to be done and the expected result.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Conditions that mark this task as done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
